<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="恋爱军师.skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#11161e"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect width="1200" height="430" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="3" fill="#1f6feb" opacity="0.7"/>
  </g>
  <rect width="1200" height="430" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <line x1="672" y1="26" x2="672" y2="404" stroke="#3b4451" stroke-width="1.2" opacity="0.85"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="64" y="70" font-size="28" font-weight="600" fill="#58a6ff">恋爱军师.skill</text>

    <text x="58" y="196" font-size="70" font-weight="700" fill="#f0f6fc">真人军师</text>

    <text x="62" y="252" font-size="28" fill="#c9d1d9">先看他站在哪一步 再给这一轮该说的话</text>

    <text x="64" y="306" font-size="26" fill="#6e7681">146 万段真人对话 挑出 208 段 1897 轮</text>

    <rect x="700" y="20" width="228" height="38" rx="10" fill="#1f6feb" opacity="0.16"/>
    <text x="722" y="46" font-size="22" fill="#79b8ff">初识</text>
    <text x="788" y="47" font-size="20" fill="#9aa4b2">刚加上微信</text>

    <rect x="700" y="72" width="320" height="48" rx="14" fill="#262d38" stroke="#3b4451" stroke-width="1"/>
    <text x="722" y="105" font-size="30" fill="#c9d1d9">你好呀 我是群里那个</text>

    <rect x="750" y="128" width="380" height="48" rx="14" fill="#1f6feb"/>
    <text x="772" y="161" font-size="30" fill="#ffffff">嗯 看到了 头像挺特别</text>

    <rect x="700" y="184" width="310" height="48" rx="14" fill="#262d38" stroke="#3b4451" stroke-width="1"/>
    <text x="722" y="217" font-size="30" fill="#c9d1d9">随便找的图 凑合用</text>

    <rect x="760" y="240" width="370" height="48" rx="14" fill="#1f6feb"/>
    <text x="782" y="273" font-size="30" fill="#ffffff">随手找的能用 算有眼光</text>

    <rect x="700" y="296" width="320" height="48" rx="14" fill="#262d38" stroke="#3b4451" stroke-width="1"/>
    <text x="722" y="329" font-size="30" fill="#c9d1d9">你这话听着像夸人啊</text>

    <rect x="900" y="352" width="230" height="48" rx="14" fill="#1f6feb"/>
    <text x="922" y="385" font-size="30" fill="#ffffff">本来也是夸啊</text>
  </g>
</svg>

