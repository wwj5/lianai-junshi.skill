<svg width="1200" height="344" viewBox="0 0 1200 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="恋爱军师.skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#11161e"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect width="1200" height="344" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="344" fill="url(#bg)"/>
    <rect width="1200" height="344" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="3" fill="#1f6feb" opacity="0.7"/>
  </g>
  <rect width="1200" height="344" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <line x1="694" y1="26" x2="694" y2="318" stroke="#3b4451" stroke-width="1.2" opacity="0.85"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="64" y="58" font-size="28" font-weight="600" fill="#58a6ff">恋爱军师.skill</text>

    <text x="58" y="156" font-size="68" font-weight="700" fill="#f0f6fc">真人军师</text>

    <text x="62" y="208" font-size="28" fill="#c9d1d9">先看他站在哪一步 再给这一轮该说的话</text>

    <text x="64" y="256" font-size="26" fill="#6e7681">146 万段真人对话 挑出 208 段 1897 轮</text>

    <rect x="722" y="16" width="196" height="48" rx="14" fill="#262d38" stroke="#3b4451" stroke-width="1"/>
    <text x="744" y="49" font-size="30" fill="#c9d1d9">吃啥都行吧</text>

    <rect x="804" y="70" width="346" height="48" rx="14" fill="#1f6feb"/>
    <text x="826" y="103" font-size="30" fill="#ffffff">那火锅 你上次提过呢</text>

    <rect x="722" y="124" width="196" height="48" rx="14" fill="#262d38" stroke="#3b4451" stroke-width="1"/>
    <text x="744" y="157" font-size="30" fill="#c9d1d9">你还记得啊</text>

    <rect x="922" y="178" width="228" height="48" rx="14" fill="#1f6feb"/>
    <text x="944" y="211" font-size="30" fill="#ffffff">嗯 说了两回</text>

    <rect x="722" y="232" width="376" height="48" rx="14" fill="#262d38" stroke="#3b4451" stroke-width="1"/>
    <text x="744" y="265" font-size="30" fill="#c9d1d9">那就火锅吧 我可不吃辣</text>

    <rect x="922" y="286" width="228" height="48" rx="14" fill="#1f6feb"/>
    <text x="944" y="319" font-size="30" fill="#ffffff">行 点半辣的</text>
  </g>
</svg>
